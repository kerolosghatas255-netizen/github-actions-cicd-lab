name: CI Pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read
  packages: write

jobs:
  test:
    name: Lint and Unit Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Run Ruff
        run: ruff check .

      - name: Run unit tests
        run: python -m pytest -q

  docker:
    name: Build, Test, Scan and Publish
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set image metadata
        run: |
          echo "IMAGE_NAME=ghcr.io/${GITHUB_REPOSITORY}" >> "$GITHUB_ENV"
          echo "SHORT_SHA=${GITHUB_SHA::7}" >> "$GITHUB_ENV"
          echo "APP_VERSION=ci-${GITHUB_RUN_NUMBER}" >> "$GITHUB_ENV"

      - name: Build Docker image
        run: |
          docker build \
            --build-arg APP_VERSION=${APP_VERSION} \
            --build-arg GIT_SHA=${SHORT_SHA} \
            -t cicd-lab:ci .

      - name: Start container
        run: |
          docker run -d \
            --name cicd-ci-test \
            -p 5000:5000 \
            -e APP_ENV=ci \
            cicd-lab:ci

      - name: Wait for application
        run: |
          for i in {1..20}; do
            if curl -fsS http://127.0.0.1:5000/health; then
              exit 0
            fi

            echo "Waiting for application..."
            sleep 2
          done

          docker logs cicd-ci-test
          exit 1

      - name: Verify health endpoint
        run: curl -fsS http://127.0.0.1:5000/health

      - name: Verify version endpoint
        run: |
          curl -fsS http://127.0.0.1:5000/version
          echo

      - name: Show container status
        run: docker ps

      - name: Stop test container
        run: docker rm -f cicd-ci-test

      - name: Scan image for vulnerabilities
        run: |
          docker run --rm \
            -v /var/run/docker.sock:/var/run/docker.sock \
            aquasec/trivy:0.58.2 \
            image \
            --ignore-unfixed \
            --severity CRITICAL \
            --exit-code 1 \
            cicd-lab:ci

      - name: Log in to GitHub Container Registry
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Tag image
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          docker tag cicd-lab:ci ${IMAGE_NAME}:sha-${SHORT_SHA}
          docker tag cicd-lab:ci ${IMAGE_NAME}:latest

      - name: Push image to GHCR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          docker push ${IMAGE_NAME}:sha-${SHORT_SHA}
          docker push ${IMAGE_NAME}:latest

      - name: Cleanup
        if: always()
        run: docker rm -f cicd-ci-test || true

  deploy-staging:
    name: Deploy to Staging
    needs: docker
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    runs-on:
      - self-hosted
      - Linux
      - X64
      - staging
      - cicd-lab

    steps:
      - name: Set deployment metadata
        run: |
          echo "IMAGE_NAME=ghcr.io/${GITHUB_REPOSITORY}" >> "$GITHUB_ENV"
          echo "SHORT_SHA=${GITHUB_SHA::7}" >> "$GITHUB_ENV"

      - name: Pull release image
        run: |
          docker pull ${IMAGE_NAME}:sha-${SHORT_SHA}

      - name: Remove previous staging container
        run: |
          docker rm -f cicd-staging || true

      - name: Deploy staging container
        run: |
          docker run -d \
            --name cicd-staging \
            --restart unless-stopped \
            -p 8081:5000 \
            -e APP_ENV=staging \
            ${IMAGE_NAME}:sha-${SHORT_SHA}

      - name: Wait for staging
        run: |
          for i in {1..20}; do
            if curl -fsS http://127.0.0.1:8081/health; then
              exit 0
            fi

            echo "Waiting for staging..."
            sleep 2
          done

          docker logs cicd-staging
          exit 1

      - name: Verify staging health
        run: |
          curl -fsS http://127.0.0.1:8081/health
          echo

      - name: Verify staging version
        run: |
          RESPONSE="$(curl -fsS http://127.0.0.1:8081/version)"
          echo "$RESPONSE"

          echo "$RESPONSE" | grep "\"commit\":\"${SHORT_SHA}\""
          echo "$RESPONSE" | grep '"environment":"staging"'

      - name: Show staging container
        run: docker ps --filter name=cicd-staging

  deploy-production:
    name: Deploy to Production
    needs: deploy-staging
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    environment:
      name: production

    concurrency:
      group: production-deployment
      cancel-in-progress: false

    runs-on:
      - self-hosted
      - Linux
      - X64
      - cicd-lab

    steps:
      - name: Set deployment metadata
        run: |
          echo "IMAGE_NAME=ghcr.io/${GITHUB_REPOSITORY}" >> "$GITHUB_ENV"
          echo "SHORT_SHA=${GITHUB_SHA::7}" >> "$GITHUB_ENV"

      - name: Pull release image
        run: |
          docker pull ${IMAGE_NAME}:sha-${SHORT_SHA}

      - name: Remove previous production container
        run: |
          docker rm -f cicd-production || true

      - name: Deploy production container
        run: |
          docker run -d \
            --name cicd-production \
            --restart unless-stopped \
            -p 8082:5000 \
            -e APP_ENV=production \
            ${IMAGE_NAME}:sha-${SHORT_SHA}

      - name: Wait for production
        run: |
          for i in {1..20}; do
            if curl -fsS http://127.0.0.1:8082/health; then
              exit 0
            fi

            echo "Waiting for production..."
            sleep 2
          done

          docker logs cicd-production
          exit 1

      - name: Verify production health
        run: |
          curl -fsS http://127.0.0.1:8082/health
          echo

      - name: Verify production version
        run: |
          RESPONSE="$(curl -fsS http://127.0.0.1:8082/version)"
          echo "$RESPONSE"

          echo "$RESPONSE" | grep "\"commit\":\"${SHORT_SHA}\""
          echo "$RESPONSE" | grep '"environment":"production"'

      - name: Show production container
        run: docker ps --filter name=cicd-production
