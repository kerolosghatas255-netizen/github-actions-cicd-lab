name: CI Pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  test:
    name: Lint and Unit Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Run Ruff
        run: ruff check .

      - name: Run unit tests
        run: python -m pytest -q

  docker:
    name: Build and Smoke Test Container
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Build Docker image
        run: |
          docker build \
            --build-arg APP_VERSION=ci-${GITHUB_RUN_NUMBER} \
            --build-arg GIT_SHA=${GITHUB_SHA::7} \
            -t cicd-lab:ci .

      - name: Start container
        run: |
          docker run -d \
            --name cicd-ci-test \
            -p 5000:5000 \
            -e APP_ENV=ci \
            cicd-lab:ci

      - name: Wait for application
        run: |
          for i in {1..20}; do
            if curl -fsS http://127.0.0.1:5000/health; then
              exit 0
            fi

            echo "Waiting for application..."
            sleep 2
          done

          docker logs cicd-ci-test
          exit 1

      - name: Verify health endpoint
        run: curl -fsS http://127.0.0.1:5000/health

      - name: Verify version endpoint
        run: curl -fsS http://127.0.0.1:5000/version

      - name: Show container status
        run: docker ps

      - name: Cleanup
        if: always()
        run: docker rm -f cicd-ci-test || true
